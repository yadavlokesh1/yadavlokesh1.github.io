name: Build and Deploy to AKS

on:
  push:
    branches:
      - main

env:
  ACR_NAME: lokeshportfolioacr
  AKS_CLUSTER: lokesh-aks
  RESOURCE_GROUP: lab-rg
  IMAGE_NAME: portfolio

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 1. Login to Azure ──────────────────────────────────────────────────
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      # ── 2. Build Docker image ──────────────────────────────────────────────
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            .

      # ── 3. Push image to Azure Container Registry ──────────────────────────
      - name: Login to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Push image to ACR
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      # ── 4. Get AKS credentials ─────────────────────────────────────────────
      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER }} \
            --overwrite-existing

      # ── 5. Apply Kubernetes deployment ────────────────────────────────────
      - name: Deploy to AKS
        run: |
          kubectl apply -f portfolio-deployment.yaml

      - name: Verify rollout
        run: |
          kubectl rollout status -f portfolio-deployment.yaml --timeout=120s
